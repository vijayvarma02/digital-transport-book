<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1d4ed8"/>
  <!-- Truck body -->
  <rect x="60" y="230" width="292" height="152" rx="20" fill="#ffffff"/>
  <!-- Truck cab -->
  <rect x="290" y="190" width="148" height="192" rx="20" fill="#ffffff"/>
  <!-- Cab window -->
  <rect x="310" y="210" width="108" height="72" rx="10" fill="#93c5fd"/>
  <!-- Wheels -->
  <circle cx="140" cy="404" r="38" fill="#1e293b"/>
  <circle cx="140" cy="404" r="16" fill="#93c5fd"/>
  <circle cx="366" cy="404" r="38" fill="#1e293b"/>
  <circle cx="366" cy="404" r="16" fill="#93c5fd"/>
  <!-- Record lines on body -->
  <rect x="80" y="268" width="160" height="14" rx="7" fill="#bfdbfe"/>
  <rect x="80" y="300" width="118" height="14" rx="7" fill="#bfdbfe"/>
  <rect x="80" y="332" width="140" height="14" rx="7" fill="#bfdbfe"/>
  <!-- ARF Travels text -->
  <text x="256" y="128" font-family="Arial,sans-serif" font-size="62" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="6">ARF</text>
  <text x="256" y="178" font-family="Arial,sans-serif" font-size="28" fill="#bfdbfe" text-anchor="middle" letter-spacing="4">TRAVELS</text>
</svg>
