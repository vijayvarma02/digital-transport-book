<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background - Apple requires filled background, no transparency -->
  <rect width="180" height="180" rx="0" fill="#1d4ed8"/>
  <!-- Truck body -->
  <rect x="22" y="84" width="104" height="54" rx="8" fill="#ffffff"/>
  <!-- Truck cab -->
  <rect x="100" y="70" width="52" height="68" rx="8" fill="#ffffff"/>
  <!-- Cab window -->
  <rect x="108" y="78" width="34" height="24" rx="4" fill="#93c5fd"/>
  <!-- Wheels -->
  <circle cx="50" cy="142" r="13" fill="#1e293b"/>
  <circle cx="50" cy="142" r="5" fill="#93c5fd"/>
  <circle cx="130" cy="142" r="13" fill="#1e293b"/>
  <circle cx="130" cy="142" r="5" fill="#93c5fd"/>
  <!-- Record lines -->
  <rect x="32" y="97" width="56" height="5" rx="2.5" fill="#bfdbfe"/>
  <rect x="32" y="109" width="42" height="5" rx="2.5" fill="#bfdbfe"/>
  <rect x="32" y="121" width="50" height="5" rx="2.5" fill="#bfdbfe"/>
  <!-- ARF text -->
  <text x="90" y="52" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">ARF</text>
  <text x="90" y="68" font-family="Arial,sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle" letter-spacing="2">TRAVELS</text>
</svg>
