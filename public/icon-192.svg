  <rect x="24" y="90" width="110" height="56" rx="8" fill="#ffffff"/>
  <!-- Truck cab -->
  <rect x="108" y="74" width="54" height="72" rx="8" fill="#ffffff"/>
  <!-- Cab window -->
  <rect x="116" y="82" width="36" height="26" rx="4" fill="#93c5fd"/>
  <!-- Wheels -->
  <circle cx="54" cy="152" r="14" fill="#1e293b"/>
  <circle cx="54" cy="152" r="6" fill="#93c5fd"/>
  <circle cx="138" cy="152" r="14" fill="#1e293b"/>
  <circle cx="138" cy="152" r="6" fill="#93c5fd"/>
  <!-- Record lines on body -->
